services:
  db:
    image: postgres:16
    container_name: licitaciones_db
    environment:
      POSTGRES_USER: licitaciones
      POSTGRES_PASSWORD: licitaciones
      POSTGRES_DB: licitaciones
    ports:
      # Puerto del host configurable (DB_PORT) para evitar choques con otros
      # Postgres locales; por defecto 5432. El puerto interno sigue siendo 5432.
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
